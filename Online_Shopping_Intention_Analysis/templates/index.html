<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Shopping Intent Predictor</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #eef2f5; padding: 40px; }
        .container { background: white; padding: 30px; border-radius: 8px; max-width: 550px; margin: auto; box-shadow: 0px 4px 12px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        label { font-weight: bold; display: block; margin-top: 12px; color: #555; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        input[type="submit"] { background: #007BFF; color: white; border: none; font-size: 16px; margin-top: 20px; cursor: pointer; }
        input[type="submit"]:hover { background: #0056b3; }
        .result { margin-top: 25px; padding: 15px; background: #e8f4fd; border-left: 5px solid #007BFF; font-weight: bold; color: #004085; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Online Shopping Purchase Intent</h2>
        <form action="/predict" method="POST">
            
            <label>Page Values:</label>
            <input type="number" step="any" name="page_values" required placeholder="e.g., 15.5">

            <label>Product Related Pages Visited:</label>
            <input type="number" name="product_related" required placeholder="e.g., 10">

            <label>Product Related Duration (seconds):</label>
            <input type="number" step="any" name="product_related_duration" required placeholder="e.g., 250.5">

            <label>Bounce Rate (0.0 to 1.0):</label>
            <input type="number" step="any" name="bounce_rates" required placeholder="e.g., 0.01">

            <label>Exit Rate (0.0 to 1.0):</label>
            <input type="number" step="any" name="exit_rates" required placeholder="e.g., 0.02">

            <label>Special Day Proximity (0.0 to 1.0):</label>
            <input type="number" step="any" name="special_day" required value="0.0">

            <label>Month:</label>
            <select name="month">
                <option value="Feb">February</option>
                <option value="Mar">March</option>
                <option value="May">May</option>
                <option value="June">June</option>
                <option value="Jul">July</option>
                <option value="Aug">August</option>
                <option value="Sep">September</option>
                <option value="Oct">October</option>
                <option value="Nov" selected>November (Peak)</option>
                <option value="Dec">December</option>
            </select>

            <label>Visitor Type:</label>
            <select name="visitor_type">
                <option value="Returning_Visitor" selected>Returning Visitor</option>
                <option value="New_Visitor">New Visitor</option>
                <option value="Other">Other</option>
            </select>

            <label>Is Weekend?</label>
            <select name="weekend">
                <option value="0">No</option>
                <option value="1">Yes</option>
            </select>

            <input type="submit" value="Predict Purchase Intent">
        </form>
        
        {% if prediction_text %}
            <div class="result">{{ prediction_text }}</div>
        {% endif %}
    </div>
</body>
</html>
